<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Blog Post</title>
</head>
<body>
    <h1>Update Blog Post</h1>

    <!-- 1. The action attribute dynamically targets the update route for this specific post ID -->
    <form action="{{ url_for('update', post_id=post['id']) }}" method="POST">

        <label for="author">Author:</label><br>
        <!-- 2. The value attribute pre-fills the current author -->
        <input type="text" id="author" name="author" value="{{ post['author'] }}"><br><br>

        <label for="title">Title:</label><br>
        <!-- The value attribute pre-fills the current title -->
        <input type="text" id="title" name="title" value="{{ post['title'] }}"><br><br>

        <label for="content">Content:</label><br>
        <!-- Note: Textareas do not use a 'value' attribute; the dynamic content goes directly between the opening and closing tags -->
        <textarea id="content" name="content">{{ post['content'] }}</textarea><br><br>

        <input type="submit" value="Update">
    </form>
</body>
</html>
