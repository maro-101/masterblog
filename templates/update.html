<!DOCTYPE html>
<html>
<head>
    <title>Update Post</title>
</head>
<body>
    <h1>Update Blog Post</h1>
    <form action="/update/{{ post.id }}" method="POST">
        <label for="author">Author:</label>
        <!-- Pre-fill the input using value="{{ post.author }}" -->
        <input type="text" id="author" name="author" value="{{ post.author }}" required><br><br>

        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ post.title }}" required><br><br>

        <label for="content">Content:</label>
        <!-- Textareas don't have a value attribute; place the data between the tags -->
        <textarea id="content" name="content" required>{{ post.content }}</textarea><br><br>

        <button type="submit">Update Post</button>
    </form>
</body>
</html>
